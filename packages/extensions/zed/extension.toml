id = "openbmw"
name = "OpenCode"
description = "The open source coding agent."
version = "1.14.39"
schema_version = 1
authors = ["Anomaly"]
repository = "https://github.com/anomalyco/openbmw"

[agent_servers.openbmw]
name = "OpenCode"
icon = "./icons/opencode\.svg"

[agent_servers.opencode\.targets.darwin-aarch64]
archive = "https://github.com/anomalyco/openbmw/releases/download/v1.14.39/opencode-darwin-arm64.zip"
cmd = "./openbmw"
args = ["acp"]

[agent_servers.opencode\.targets.darwin-x86_64]
archive = "https://github.com/anomalyco/openbmw/releases/download/v1.14.39/opencode-darwin-x64.zip"
cmd = "./openbmw"
args = ["acp"]

[agent_servers.opencode\.targets.linux-aarch64]
archive = "https://github.com/anomalyco/openbmw/releases/download/v1.14.39/opencode-linux-arm64.tar.gz"
cmd = "./openbmw"
args = ["acp"]

[agent_servers.opencode\.targets.linux-x86_64]
archive = "https://github.com/anomalyco/openbmw/releases/download/v1.14.39/opencode-linux-x64.tar.gz"
cmd = "./openbmw"
args = ["acp"]

[agent_servers.opencode\.targets.windows-x86_64]
archive = "https://github.com/anomalyco/openbmw/releases/download/v1.14.39/opencode-windows-x64.zip"
cmd = "./opencode\.exe"
args = ["acp"]
